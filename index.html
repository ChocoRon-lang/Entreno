<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Entreno" />
<meta name="theme-color" content="#0B0B0E" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Entreno%22,%22display%22:%22standalone%22}" />
<title>Entreno</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0E;
    --card: #17171C;
    --field-bg: #1D1D23;
    --hairline: #2A2A32;
    --ink: #F2F2F5;
    --ink-soft: #8A8A93;
    --accent: #6E7BFF;
    --accent-strong: #8B95FF;
    --accent-soft: rgba(110,123,255,0.14);
    --urgent: #F2555A;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    overscroll-behavior-y: none;
  }
  #app, #authScreen { height: 100dvh; display: flex; flex-direction: column; }
  main { flex: 1; overflow-y: auto; padding: 6px 20px 20px 20px; -webkit-overflow-scrolling: touch; }
  h1, h2, h3, p { margin: 0; }
  button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }
  input, textarea { font-family: inherit; }

  /* ---- Auth ---- */
  #authScreen { align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 340px; }
  .auth-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 4px; text-align: center; }
  .auth-sub { font-size: 13px; color: var(--ink-soft); text-align: center; margin-bottom: 24px; }
  .auth-card input {
    width: 100%; padding: 13px 14px; margin-bottom: 10px;
    background: var(--field-bg); border: 1px solid var(--hairline); border-radius: 12px;
    color: var(--ink); font-size: 15px;
  }
  .auth-submit-btn {
    width: 100%; padding: 14px; margin-top: 6px;
    background: var(--accent); color: #fff; border-radius: 12px;
    font-size: 15px; font-weight: 700;
  }
  .auth-switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--ink-soft); }
  .auth-switch button { color: var(--accent-strong); font-weight: 650; }
  .auth-error { color: var(--urgent); font-size: 12.5px; margin-top: 8px; text-align: center; display: none; }

  /* ---- Header ---- */
  header {
    padding: calc(var(--safe-top) + 14px) 20px 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); flex-shrink: 0;
  }
  .icon-btn:active { background: var(--field-bg); }
  .header-actions { display: flex; gap: 4px; }

  /* ---- Bottom nav (2 tabs) ---- */
  .bottom-tabs {
    display: flex;
    border-top: 1px solid var(--hairline);
    padding-bottom: var(--safe-bottom);
    background: var(--bg);
  }
  .bottom-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 0 8px 0;
    color: var(--ink-soft);
  }
  .bottom-tab.active { color: var(--accent-strong); }
  .bottom-tab span { font-size: 10.5px; font-weight: 650; }

  .page { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .subview { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* ---- Generic components ---- */
  .card {
    background: var(--card); border: 1px solid var(--hairline); border-radius: 16px;
    padding: 18px; margin-bottom: 12px;
  }
  .field-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin: 14px 0 6px 0; }
  .field-label:first-child { margin-top: 0; }
  .text-input {
    width: 100%; padding: 11px 13px;
    background: var(--field-bg); border: 1px solid var(--hairline); border-radius: 11px;
    color: var(--ink); font-size: 14px;
  }
  .primary-btn {
    display: block; width: 100%; padding: 14px;
    background: var(--accent); color: #fff; border-radius: 13px;
    font-size: 14.5px; font-weight: 700; text-align: center;
  }
  .ghost-btn {
    display: block; width: 100%; padding: 12px;
    background: var(--field-bg); border: 1px solid var(--hairline); color: var(--ink);
    border-radius: 12px; font-size: 13.5px; font-weight: 650; text-align: center;
  }
  .danger-btn { color: var(--urgent); border-color: var(--urgent); }
  .empty-state { text-align: center; padding: 40px 16px; color: var(--ink-soft); }
  .empty-state .glyph { font-size: 34px; margin-bottom: 10px; }
  .empty-state p { font-size: 13.5px; line-height: 1.5; }

  .list-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 9px; cursor: pointer;
  }
  .list-row-info { flex: 1; min-width: 0; }
  .list-row-name { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .list-row-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .list-row-chevron { color: var(--ink-soft); flex-shrink: 0; }
  .remove-btn { color: var(--urgent); font-size: 15px; flex-shrink: 0; padding: 4px; }

  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: calc(var(--safe-top) + 12px) 20px 10px 20px;
  }
  .toolbar h2 { flex: 1; font-size: 18px; font-weight: 750; letter-spacing: -0.01em; }

  .version-badge {
    position: fixed; top: calc(var(--safe-top) + 6px); left: 12px;
    font-size: 9.5px; color: var(--ink-soft); z-index: 5;
    display: flex; align-items: center; gap: 4px; opacity: 0.6;
  }
  .version-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-soft); }
  .version-badge.current .version-dot { background: #3FC373; }
  .version-badge.outdated { color: #F5A623; cursor: pointer; opacity: 1; }
  .version-badge.outdated .version-dot { background: #F5A623; }
</style>
</head>
<body>

<div id="authScreen" style="display:none;">
  <div class="auth-card">
    <div class="auth-title">Entreno</div>
    <div class="auth-sub" id="authSubtitle">Inicia sesión para continuar</div>
    <input id="authEmail" type="email" placeholder="Correo electrónico" autocomplete="username" />
    <input id="authPassword" type="password" placeholder="Contraseña" autocomplete="current-password" />
    <button class="auth-submit-btn" id="authSubmitBtn">Entrar</button>
    <div class="auth-error" id="authErrorEl"></div>
    <div class="auth-switch">
      <span id="authSwitchLabel">¿No tienes cuenta?</span>
      <button id="authSwitchBtn">Crear cuenta</button>
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="version-badge" id="versionBadge"><span class="version-dot"></span><span id="versionText">—</span></div>

  <header>
    <h1 id="pageTitle">Entreno</h1>
    <div class="header-actions">
      <button class="icon-btn" id="signOutBtn" aria-label="Cerrar sesión">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <!-- Sección 1: Planillas -->
  <div id="planillasPage" class="page">
    <main id="planillasHome">
      <div class="empty-state">
        <div class="glyph">📋</div>
        <p>Todavía no has cargado ninguna planilla.<br/>Pídele a Claude que agregue una (por ahora, Juggernaut).</p>
      </div>
    </main>
  </div>

  <!-- Sección 2: Rutinas libres -->
  <div id="rutinasPage" class="page" style="display:none;">
    <main>
      <div class="empty-state">
        <div class="glyph">🏋️</div>
        <p>Las rutinas libres se agregan en el próximo paso.</p>
      </div>
    </main>
  </div>

  <nav class="bottom-tabs">
    <button class="bottom-tab active" id="navPlanillas" data-page="planillas">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M6 4h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 4v5h5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Planillas</span>
    </button>
    <button class="bottom-tab" id="navRutinas" data-page="rutinas">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M6.5 6.5v11M17.5 6.5v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="3" y="9" width="3" height="6" rx="1" fill="currentColor"/><rect x="18" y="9" width="3" height="6" rx="1" fill="currentColor"/><path d="M9 12h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Rutinas</span>
    </button>
  </nav>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js';
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut
} from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc,
  initializeFirestore, persistentLocalCache, persistentSingleTabManager
} from 'https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js';

// ⚠️ PEGA AQUÍ TU firebaseConfig REAL (del proyecto nuevo que creaste) ⚠️
// Reemplaza todo este objeto por el que copiaste desde la consola de Firebase.
const firebaseConfig = {
  apiKey: "AIzaSyAmUnE5BF1fmVLn-yxHjTjfPcwI2zT2930",
  authDomain: "entrenamiento-d63e1.firebaseapp.com",
  projectId: "entrenamiento-d63e1",
  storageBucket: "entrenamiento-d63e1.firebasestorage.app",
  messagingSenderId: "6438543836",
  appId: "1:6438543836:web:d227b230b691703ac02f19"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = initializeFirestore(firebaseApp, {
  localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() }),
});

// ---- DOM refs ----
const authScreenEl = document.getElementById('authScreen');
const authEmailEl = document.getElementById('authEmail');
const authPasswordEl = document.getElementById('authPassword');
const authSubmitBtn = document.getElementById('authSubmitBtn');
const authErrorEl = document.getElementById('authErrorEl');
const authSubtitleEl = document.getElementById('authSubtitle');
const authSwitchLabel = document.getElementById('authSwitchLabel');
const authSwitchBtn = document.getElementById('authSwitchBtn');

const appEl = document.getElementById('app');
const signOutBtn = document.getElementById('signOutBtn');
const navPlanillas = document.getElementById('navPlanillas');
const navRutinas = document.getElementById('navRutinas');
const planillasPageEl = document.getElementById('planillasPage');
const rutinasPageEl = document.getElementById('rutinasPage');
const pageTitleEl = document.getElementById('pageTitle');

const versionBadgeEl = document.getElementById('versionBadge');
const versionTextEl = document.getElementById('versionText');

// ---- State ----
let currentUserId = null;
let currentPage = 'planillas';
let loaded = false;
let dataLoadOk = false;
let saveTimer = null;

// Placeholder top-level data — se expande cuando agreguemos cada sección.
let planillas = {};   // { juggernaut: {...} } — solo existe si el usuario la cargó
let rutinasLibres = []; // [{id, name, exercises:[...]}]

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// ---- Auth mode toggle ----
let authMode = 'login';
authSwitchBtn.addEventListener('click', () => {
  authMode = authMode === 'login' ? 'signup' : 'login';
  authSubtitleEl.textContent = authMode === 'login' ? 'Inicia sesión para continuar' : 'Crea tu cuenta';
  authSubmitBtn.textContent = authMode === 'login' ? 'Entrar' : 'Crear cuenta';
  authSwitchLabel.textContent = authMode === 'login' ? '¿No tienes cuenta?' : '¿Ya tienes cuenta?';
  authSwitchBtn.textContent = authMode === 'login' ? 'Crear cuenta' : 'Entrar';
  authErrorEl.style.display = 'none';
});

authSubmitBtn.addEventListener('click', async () => {
  const email = authEmailEl.value.trim();
  const password = authPasswordEl.value;
  authErrorEl.style.display = 'none';
  if (!email || !password) {
    authErrorEl.textContent = 'Completa correo y contraseña.';
    authErrorEl.style.display = '';
    return;
  }
  try {
    if (authMode === 'login') {
      await signInWithEmailAndPassword(auth, email, password);
    } else {
      await createUserWithEmailAndPassword(auth, email, password);
    }
  } catch (e) {
    authErrorEl.textContent = 'Error: ' + (e.message || 'no se pudo completar');
    authErrorEl.style.display = '';
  }
});

signOutBtn.addEventListener('click', () => { signOut(auth); });

// ---- Navigation ----
function setPage(page){
  if (currentPage === page && loaded) { /* still allow re-render below */ }
  currentPage = page;
  planillasPageEl.style.display = page === 'planillas' ? 'flex' : 'none';
  rutinasPageEl.style.display = page === 'rutinas' ? 'flex' : 'none';
  navPlanillas.classList.toggle('active', page === 'planillas');
  navRutinas.classList.toggle('active', page === 'rutinas');
  pageTitleEl.textContent = page === 'planillas' ? 'Planillas' : 'Rutinas';
}
navPlanillas.addEventListener('click', () => setPage('planillas'));
navRutinas.addEventListener('click', () => setPage('rutinas'));

// ---- Firestore load/save (mismo patrón probado que usamos en Prisma) ----
function scheduleSave(){
  if (!dataLoadOk) return; // nunca escribir si la carga inicial falló — evita sobrescribir con datos vacíos
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 350);
}

async function persist(){
  if (!currentUserId || !dataLoadOk) return;
  try {
    await setDoc(doc(db, 'users', currentUserId), { planillas, rutinasLibres });
  } catch (e) {
    console.error('Error guardando:', e);
  }
}

async function load(){
  try {
    const snap = await getDoc(doc(db, 'users', currentUserId));
    const state = snap.exists() ? snap.data() : {};
    planillas = (state.planillas && typeof state.planillas === 'object') ? state.planillas : {};
    rutinasLibres = Array.isArray(state.rutinasLibres) ? state.rutinasLibres : [];
    dataLoadOk = true;
  } catch (e) {
    console.error('Error cargando:', e);
    dataLoadOk = false;
    return;
  }
  loaded = true;
  renderPlanillasHome();
  renderRutinasHome();
}

function renderPlanillasHome(){
  // Se construye en el siguiente paso (motor Juggernaut).
}
function renderRutinasHome(){
  // Se construye en el siguiente paso (rutinas libres).
}

function resetLocalState(){
  planillas = {};
  rutinasLibres = [];
  loaded = false;
  dataLoadOk = false;
  currentPage = 'planillas';
  setPage('planillas');
}

// ---- Auth state ----
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUserId = user.uid;
    authScreenEl.style.display = 'none';
    appEl.style.display = 'flex';
    await load();
  } else {
    currentUserId = null;
    resetLocalState();
    appEl.style.display = 'none';
    authScreenEl.style.display = 'flex';
  }
});

// ---- Version check (mismo patrón que Prisma) ----
const APP_VERSION = '2026-08-13.1';
async function checkVersion(){
  try {
    const res = await fetch('version.json?t=' + Date.now());
    const data = await res.json();
    const current = data.version === APP_VERSION;
    versionBadgeEl.classList.toggle('current', current);
    versionBadgeEl.classList.toggle('outdated', !current);
    versionTextEl.textContent = current ? 'Actualizado' : 'Nueva versión';
    versionBadgeEl.onclick = current ? null : () => location.reload();
  } catch (e) { /* sin conexión — no molestar */ }
}
checkVersion();
setInterval(checkVersion, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkVersion(); });

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
